[project]
name = "kitchen-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",    # seed_vocabulary only
    "anthropic",        # real AI mode only
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
